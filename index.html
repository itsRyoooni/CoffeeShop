<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Coffee Shop</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#coffees">Coffees</a>
            <a href="#bakery">Bakery</a>
            <a href="#login">Login</a>
        </nav>
    </header>

    <main>
        <section id="home" class="hero">
            <div>
                <p class="small-title">Freshly made for you</p>
                <h1>Welcome to Coffee Shop!</h1>
                <p>Enjoy our delicious coffee and freshly baked desserts.</p>
                <a class="main-button" href="#coffees">Order here</a>
            </div>
        </section>

        <section id="coffees" class="section">
            <h2>Our Menu</h2>

            <div class="category">
                <h3>Hot Coffee</h3>
                <!-- تُملأ من Firebase (GET) -->
                <div class="cards" id="hot-coffee"></div>
            </div>

            <div class="category">
                <h3>Cold Coffee</h3>
                <!-- تُملأ من Firebase (GET) -->
                <div class="cards" id="cold-coffee"></div>
            </div>
        </section>

        <section id="bakery" class="section bakery-section">
            <h2>Bakery</h2>
            <!-- تُملأ من Firebase (GET) -->
            <div class="cards" id="bakery-cards"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 Coffee Shop. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
